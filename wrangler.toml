# ============================================================
# Nexus (CrCLARE Identity Hub) - Cloudflare Workers Configuration
# ============================================================
name = "nexus"
main = "src/index.js"
compatibility_date = "2024-04-01"

# D1 Database Binding (The Core Khala)
[[d1_databases]]
binding = "DB"
database_name = "nexus-db"
database_id = "YOUR_D1_DATABASE_ID" # Replace after creating D1 database

# KV Namespace Binding (For caching and rate limiting)
[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID" # Replace after creating KV namespace

# Environment Variables
[vars]
# These are non-sensitive defaults. Sensitive data like INIT_ADMIN_PASSWORD 
# and JWT_SECRET must be set via `wrangler secret put` or Cloudflare Dashboard.
POWERED_BY_URL = "https://github.com/CrCLARE/Nexus"
POWERED_BY_TEXT = "Powered by Nexus"
